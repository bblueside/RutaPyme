<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RutaPyme · Rutas más baratas con inteligencia de grafos</title>
  <meta name="description" content="Convierte tu red de entregas en un grafo y calcula en segundos la ruta de menor costo. Menos kilómetros, más entregas por día.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
  <!-- El póster de la escena 1 es el LCP: se pide antes de que el motor monte el DOM. -->
  <link rel="preload" as="image" type="image/avif" fetchpriority="high" imagesizes="100vw"
        imagesrcset="escenas/opt/escena_1.v2-1280.avif 1280w, escenas/opt/escena_1.v2-1920.avif 1920w, escenas/opt/escena_1.v2-2560.avif 2560w">
  <style>
    /* Tema blueprint aprobado: fondo y línea idénticos a los de las escenas generadas. */
    :root, .sw-root {
      --sw-bg: #0146C1;
      --sw-ink: #E3E5FC;
      --sw-ink-soft: #B9C2F0;
      --sw-accent: #E3E5FC;
      --sw-font-display: "Inter Tight", system-ui, sans-serif;
      --sw-font-body: "Manrope", system-ui, sans-serif;
    }
    html, body { margin: 0; background: #0146C1; }
    /* El motor rellena los botones principales con --sw-ink (claro): el texto va en azul. */
    .sw-btn--primary, .sw-topcta { color: #0146C1; }
    /* Copys un poco más pequeños que los del motor (el prefijo html body gana por especificidad). */
    html body .sw-copy__eyebrow { font-size: .72rem; }
    html body .sw-copy__title { font-size: clamp(1.7rem, 3.7vw, 3rem); }
    html body .sw-copy__body { font-size: clamp(.9rem, 1.1vw, 1rem); margin: 10px 0 0; }
    html body .sw-copy__cta { margin-top: 14px; }
    @media (max-width: 768px) {
      html body .sw-copy__title { font-size: clamp(1.6rem, 6.3vw, 2.3rem); }
      html body .sw-copy__body { font-size: clamp(.88rem, 3.2vw, .98rem); }
    }
  </style>
</head>
<body>
  <div id="inicio"></div>
  <div id="mundo"></div>

  <script src="scrub-engine.js"></script>
  <script>
    // La interfaz real la sirve el backend (python -m backend.api) en este puerto.
    const URL_INTERFAZ = 'http://127.0.0.1:8000';

    // Assets optimizados por scroll-assets/blueprint/optimizar_upscale.py (plan: docs/landing/plan-assets-upscale.md).
    // El motor elige la variante de cada clip según el equipo: AV1 1080p, H.264 720p o sus versiones móviles.
    const VERSION_ASSETS = 'v2';
    const poster = n => ({ base: `escenas/opt/${n}.${VERSION_ASSETS}`, anchos: [1280, 1920, 2560] });
    const clip = n => ({
      av1: `videos/1080/${n}.${VERSION_ASSETS}.av1.mp4`,
      h264: `videos/720/${n}.${VERSION_ASSETS}.h264.mp4`,
      movilAv1: `videos/720/${n}.${VERSION_ASSETS}.movil.av1.mp4`,
      movilH264: `videos/720/${n}.${VERSION_ASSETS}.movil.h264.mp4`,
    });

    mountScrollWorld(document.getElementById('mundo'), {
      brand: { name: 'RutaPyme', href: '#inicio', logo: 'assets/logo_white.png' },
      cta: { label: 'Probar el optimizador', href: URL_INTERFAZ },
      hint: 'desplázate y mira cómo optimizamos tu ruta',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        {
          id: 'bodega', label: 'Bodega',
          still: poster('escena_1'),
          clip: clip('escena_1'),
          eyebrow: 'Optimización de rutas para pymes',
          title: 'Cada kilómetro de más es plata que se va.',
          body: 'Los pedidos salen "a ojo" y las rutas se improvisan. Con RutaPyme, tu bodega deja de adivinar y empieza a calcular.',
        },
        {
          id: 'modelo', label: 'Modelo',
          still: poster('escena_2'),
          clip: clip('escena_2'),
          scroll: 1.5, linger: 0.35,
          eyebrow: 'Del instinto a los grafos',
          title: 'Tu operación, convertida en un grafo.',
          body: 'Modelamos bodegas, clientes y calles como una red matemática y la consultamos al instante por API. Sin hojas de cálculo ni suposiciones.',
        },
        {
          id: 'red', label: 'Red',
          still: poster('escena_3'),
          clip: clip('escena_3'),
          scroll: 1.5, linger: 0.35,
          eyebrow: 'Nodos, aristas y costos',
          title: 'Cada punto es un nodo. Cada calle, una arista con costo.',
          body: 'Calles cerradas, vías de un solo sentido y distancias reales entran al modelo. Los trayectos bloqueados salen del cálculo antes de que te cuesten un viaje perdido.',
        },
        {
          id: 'ruta', label: 'Ruta',
          still: poster('escena_4'),
          clip: clip('escena_4'),
          scroll: 1.7, linger: 0.4,
          eyebrow: 'Alcance y ruta óptima',
          title: 'Sabe hasta dónde llegas y por dónde te sale más barato.',
          body: 'Desde cualquier bodega, RutaPyme calcula todos los destinos alcanzables y traza la ruta de menor costo. Más entregas por jornada con el mismo vehículo.',
          cta: { primary: { label: 'Optimizar mi primera ruta', href: URL_INTERFAZ },
                 secondary: { label: 'Volver al inicio', href: '#inicio' } },
        },
      ],
      // escena_1 es el conector de prueba 1→2 y entrada_2 arranca en su último fotograma real:
      // no hace falta conector aéreo entre ellas (null = fundido directo).
      connectors: [null, clip('conector_2_3'), clip('conector_3_4')],
    });
  </script>
</body>
</html>
